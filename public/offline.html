<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta
      name="theme-color"
      content="#f6eddf"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1f1a14"
      media="(prefers-color-scheme: dark)"
    />
    <title>Offline | Roastbook</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6eddf;
        --foreground: #3a2a1e;
        --card: #ffffff;
        --border: #ead9bf;
        --primary: #aa612f;
        --primary-foreground: #fffaf3;
        --muted-foreground: #796957;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1f1a14;
          --foreground: #f6eddf;
          --card: #2a2219;
          --border: #3c2e20;
          --primary: #d2873e;
          --primary-foreground: #1f1a14;
          --muted-foreground: #b8a78f;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family:
          "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: 100%;
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow: 0 8px 24px -18px rgb(60 42 30 / 45%);
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 1rem;
      }

      .eyebrow {
        margin: 1rem 0 0;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--muted-foreground);
        line-height: 1.6;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-foreground);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo192.png" width="72" height="72" alt="" />
      <p class="eyebrow">Roastbook</p>
      <h1>You're offline</h1>
      <p>
        Roastbook needs a connection to load your coffee journal. Reconnect,
        then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
